<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Вопрос обычными словами «Откуда приходили люди за неделю и сколько дошло до цели» и ответ таблицей: источники трафика с визитами, достигнутыми целями и конверсией">
<style>
  .sans { font-family: "Golos Text", -apple-system, "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .tag { font-size: 12px; fill: #98a1ab; letter-spacing: .4px; }
  .q { font-size: 34px; font-weight: 700; fill: #16191d; letter-spacing: -.5px; }
  .chiptext { font-size: 13px; fill: #2a4a7f; }
  .th { font-size: 11px; letter-spacing: 1.2px; fill: #98a1ab; font-weight: 600; }
  .td { font-size: 17px; fill: #16191d; }
  .num { font-size: 17px; fill: #16191d; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cr { fill: #2f7d5b; }
  .foottext { font-size: 15px; fill: #4c545e; }
  .q1 { animation: fade 8s linear infinite; animation-delay: .2s; }
  .q2 { animation: fade 8s linear infinite; animation-delay: .7s; }
  .chip { animation: fade 8s linear infinite; animation-delay: 1.3s; }
  .row { animation: fade 8s linear infinite; }
  .bar { animation: grow 8s linear infinite; transform-origin: left center; }
  .foot { animation: fade 8s linear infinite; animation-delay: 3.3s; }
  @keyframes fade { 0%, 4% { opacity: 0; } 12%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes grow { 0%, 4% { transform: scaleX(0); } 14%, 92% { transform: scaleX(1); } 98%, 100% { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) {
    .q1, .q2, .chip, .row, .foot { animation: none; opacity: 1; }
    .bar { animation: none; transform: scaleX(1); }
  }
</style>
<rect width="1200" height="630" fill="#eceef0"/>

<text class="mono tag" x="80" y="70">yandex-metrika-mcp</text>

<g class="q1">
  <text class="sans q" x="80" y="168">Откуда приходили люди за неделю</text>
</g>
<g class="q2">
  <text class="sans q" x="80" y="214">и сколько дошло до цели?</text>
</g>

<g class="chip">
  <rect x="80" y="252" width="160.3" height="26" rx="13" fill="#f7f8f9" stroke="#2a4a7f" stroke-opacity=".4"/>
  <text class="mono chiptext" x="93" y="270">metrika_stat_data</text>
</g>

<text class="sans th" x="80" y="330">ИСТОЧНИК</text>
<text class="sans th" x="420" y="330">ВИЗИТЫ</text>
<text class="sans th" x="1010" y="330" text-anchor="end">ЦЕЛИ</text>
<text class="sans th" x="1120" y="330" text-anchor="end">КОНВЕРСИЯ</text>
<line x1="80" y1="342" x2="1120" y2="342" stroke="#16191d" stroke-width="1.4"/>
<g class="row" style="animation-delay:1.80s">
  <text class="sans td" x="80" y="372">Поиск</text>
  <rect class="bar" x="420" y="360" width="300.0" height="15" rx="1.5" fill="#b9c6d6" style="animation-delay:1.90s"/>
  <text class="sans num" x="732.0" y="372">12 480</text>
  <text class="sans num" x="1010" y="372" text-anchor="end">386</text>
  <text class="sans num cr" x="1120" y="372" text-anchor="end">3,1%</text>
</g>
<g class="row" style="animation-delay:2.10s">
  <text class="sans td" x="80" y="416">Реклама</text>
  <rect class="bar" x="420" y="404" width="51.4" height="15" rx="1.5" fill="#b9c6d6" style="animation-delay:2.20s"/>
  <text class="sans num" x="483.4" y="416">2 140</text>
  <text class="sans num" x="1010" y="416" text-anchor="end">118</text>
  <text class="sans num cr" x="1120" y="416" text-anchor="end">5,5%</text>
</g>
<g class="row" style="animation-delay:2.40s">
  <text class="sans td" x="80" y="460">Прямые заходы</text>
  <rect class="bar" x="420" y="448" width="45.8" height="15" rx="1.5" fill="#b9c6d6" style="animation-delay:2.50s"/>
  <text class="sans num" x="477.8" y="460">1 905</text>
  <text class="sans num" x="1010" y="460" text-anchor="end">44</text>
  <text class="sans num cr" x="1120" y="460" text-anchor="end">2,3%</text>
</g>
<g class="row" style="animation-delay:2.70s">
  <text class="sans td" x="80" y="504">Переходы по ссылкам</text>
  <rect class="bar" x="420" y="492" width="15.4" height="15" rx="1.5" fill="#b9c6d6" style="animation-delay:2.80s"/>
  <text class="sans num" x="447.4" y="504">640</text>
  <text class="sans num" x="1010" y="504" text-anchor="end">12</text>
  <text class="sans num cr" x="1120" y="504" text-anchor="end">1,9%</text>
</g>

<g class="foot">
  <line x1="80" y1="546" x2="1120" y2="546" stroke="#d2d7dd"/>
  <circle cx="86" cy="578" r="3.5" fill="#c8362a"/>
  <text class="sans foottext" x="100" y="583">Семь шагов в интерфейсе Метрики — одним вопросом.</text>
  <text class="mono tag" x="1120" y="583" text-anchor="end">npx -y yandex-metrika-mcp-server@3</text>
</g>
</svg>
