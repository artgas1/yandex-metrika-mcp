<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Слева семь шагов в интерфейсе Яндекс Метрики, справа тот же результат одним вопросом в чате: таблица источников с визитами, целями и конверсией">
<style>
  .sans { font-family: "Golos Text", -apple-system, "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .eyebrow { font-size: 11.5px; letter-spacing: 1.6px; fill: #98a1ab; font-weight: 600; }
  .h1 { font-size: 40px; font-weight: 800; fill: #16191d; letter-spacing: -.8px; }
  .lede { font-size: 15px; fill: #4c545e; }
  .colhead { font-size: 11.5px; letter-spacing: 1.4px; font-weight: 600; }
  .step { font-size: 14px; fill: #4c545e; }
  .stepn { font-size: 10px; fill: #98a1ab; font-weight: 600; }
  .cost { font-size: 13px; fill: #98a1ab; }
  .q { font-size: 18.5px; fill: #16191d; font-weight: 600; }
  .chiptext { font-size: 11.5px; fill: #2a4a7f; }
  .th { font-size: 11px; letter-spacing: 1.1px; fill: #98a1ab; font-weight: 600; }
  .td { font-size: 15px; fill: #16191d; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .cr { fill: #2f7d5b; }
  .notetext { font-size: 12.5px; fill: #4c545e; }
  .row { animation: rowin 9s linear infinite; }
  @keyframes rowin { 0%, 18% { opacity: 0; } 26%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
  .note { animation: notein 9s linear infinite; }
  @keyframes notein { 0%, 46% { opacity: 0; } 53%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
  .chip { animation: chipin 9s linear infinite; }
  @keyframes chipin { 0%, 10% { opacity: 0; } 16%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .row, .note, .chip { animation: none; opacity: 1; } }
</style>
<rect width="1200" height="630" fill="#eceef0"/>
<text class="sans eyebrow" x="48" y="46">ЯНДЕКС МЕТРИКА · MCP · ПРИМЕР ОТВЕТА</text>
<text class="sans h1" x="48" y="90">Спросить словами</text>
<text class="sans lede" x="48" y="114">Сервер не открывает интерфейс. Он забирает семь шагов, которые надо было помнить.</text>

<line x1="48" y1="140" x2="1152" y2="140" stroke="#d2d7dd"/>

<text class="sans colhead eyebrow" x="48" y="172">БЫЛО · РУКАМИ В ИНТЕРФЕЙСЕ</text>
<circle cx="60" cy="210" r="8.5" fill="none" stroke="#98a1ab" stroke-width="1"/>
<text class="sans stepn" x="60" y="213.5" text-anchor="middle">1</text>
<text class="sans step" x="80" y="214">открыть Метрику, выбрать счётчик</text>
<circle cx="60" cy="244" r="8.5" fill="none" stroke="#98a1ab" stroke-width="1"/>
<text class="sans stepn" x="60" y="247.5" text-anchor="middle">2</text>
<text class="sans step" x="80" y="248">найти отчёт «Источники → Сводка»</text>
<circle cx="60" cy="278" r="8.5" fill="none" stroke="#98a1ab" stroke-width="1"/>
<text class="sans stepn" x="60" y="281.5" text-anchor="middle">3</text>
<text class="sans step" x="80" y="282">поставить группировку по источнику</text>
<circle cx="60" cy="312" r="8.5" fill="none" stroke="#98a1ab" stroke-width="1"/>
<text class="sans stepn" x="60" y="315.5" text-anchor="middle">4</text>
<text class="sans step" x="80" y="316">выставить период</text>
<circle cx="60" cy="346" r="8.5" fill="none" stroke="#98a1ab" stroke-width="1"/>
<text class="sans stepn" x="60" y="349.5" text-anchor="middle">5</text>
<text class="sans step" x="80" y="350">применить сегмент «цель достигнута»</text>
<circle cx="60" cy="380" r="8.5" fill="none" stroke="#98a1ab" stroke-width="1"/>
<text class="sans stepn" x="60" y="383.5" text-anchor="middle">6</text>
<text class="sans step" x="80" y="384">вспомнить, как режутся роботы</text>
<circle cx="60" cy="414" r="8.5" fill="none" stroke="#98a1ab" stroke-width="1"/>
<text class="sans stepn" x="60" y="417.5" text-anchor="middle">7</text>
<text class="sans step" x="80" y="418">выгрузить и посчитать доли</text>
<text class="sans cost" x="48" y="474">семь шагов, и это надо помнить каждый раз</text>

<line x1="560" y1="152" x2="560" y2="500" stroke="#d2d7dd"/>

<text class="sans colhead eyebrow" x="640" y="172">СТАЛО · ОДНОЙ ФРАЗОЙ</text>
<rect x="618" y="192" width="534" height="72" rx="3" fill="#f7f8f9" stroke="#d2d7dd"/>
<text class="sans q" x="640" y="222">Откуда приходили люди за неделю</text>
<text class="sans q" x="640" y="247">и сколько дошло до цели?</text>

<g class="chip">
  <rect x="618" y="282" width="142.7" height="21" rx="10.5" fill="none" stroke="#2a4a7f" stroke-opacity=".45"/>
  <text class="mono chiptext" x="629" y="296">metrika_stat_data</text>
</g>

<text class="sans th" x="640" y="330" >источник</text>
<text class="sans th" x="940" y="330" text-anchor="end">визиты</text>
<text class="sans th" x="1030" y="330" text-anchor="end">цели</text>
<text class="sans th" x="1130" y="330" text-anchor="end">конверсия</text>
<line x1="640" y1="340" x2="1152" y2="340" stroke="#16191d" stroke-width="1.4"/>
<g class="row" style="animation-delay:1.60s"><text class="sans td" x="640" y="362">Поиск</text><text class="sans td num" x="940" y="362" text-anchor="end">12 480</text><text class="sans td num" x="1030" y="362" text-anchor="end">386</text><text class="sans td num cr" x="1130" y="362" text-anchor="end">3,1%</text><line x1="640" y1="373" x2="1152" y2="373" stroke="#d2d7dd" stroke-width="1"/></g>
<g class="row" style="animation-delay:1.82s"><text class="sans td" x="640" y="394">Реклама</text><text class="sans td num" x="940" y="394" text-anchor="end">2 140</text><text class="sans td num" x="1030" y="394" text-anchor="end">118</text><text class="sans td num cr" x="1130" y="394" text-anchor="end">5,5%</text><line x1="640" y1="405" x2="1152" y2="405" stroke="#d2d7dd" stroke-width="1"/></g>
<g class="row" style="animation-delay:2.04s"><text class="sans td" x="640" y="426">Прямые заходы</text><text class="sans td num" x="940" y="426" text-anchor="end">1 905</text><text class="sans td num" x="1030" y="426" text-anchor="end">44</text><text class="sans td num cr" x="1130" y="426" text-anchor="end">2,3%</text><line x1="640" y1="437" x2="1152" y2="437" stroke="#d2d7dd" stroke-width="1"/></g>
<g class="row" style="animation-delay:2.26s"><text class="sans td" x="640" y="458">Переходы по ссылкам</text><text class="sans td num" x="940" y="458" text-anchor="end">640</text><text class="sans td num" x="1030" y="458" text-anchor="end">12</text><text class="sans td num cr" x="1130" y="458" text-anchor="end">1,9%</text><line x1="640" y1="469" x2="1152" y2="469" stroke="#d2d7dd" stroke-width="1"/></g>

<g class="note" style="animation-delay:0s">
  <rect x="618" y="506" width="534" height="34" rx="3" fill="#e3e6ea"/>
  <circle cx="638" cy="523" r="3.5" fill="#c8362a"/>
  <text class="sans notetext" x="652" y="527">сервер добавил от себя: ym:s:isRobot=='no' — и объявил это в ответе</text>
</g>

<text class="sans cost" x="48" y="580">Числа в примере иллюстративные.</text>
<text class="mono cost" x="1152" y="580" text-anchor="end">npx -y yandex-metrika-mcp-server@3</text>
</svg>
