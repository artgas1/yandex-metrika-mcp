name: Publish

# Выпуск идёт по тегу и только по нему: тег — это единственная точка, где
# принято решение «эта сборка уходит наружу».
on:
  push:
    tags: ['v*']

jobs:
  # Тесты гоняются заново на том же коммите, что и публикуется. Зелёный CI на
  # ветке не доказывает, что зелёный именно тег.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Версия в package.json совпадает с тегом
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::тег v$TAG, а в package.json $PKG — публиковать нечего"
            exit 1
          fi
          SRV=$(node -p "require('./server.json').version")
          if [ "$TAG" != "$SRV" ]; then
            echo "::error::тег v$TAG, а в server.json $SRV — реестр получит не ту версию"
            exit 1
          fi
          echo "версия $PKG сходится в package.json, server.json и теге"
          # Владение npm-пакетом реестр проверяет по полю mcpName в package.json.
          # Маркер mcp-name в README — механизм PyPI, для npm он не читается,
          # и без этой сверки расхождение всплывает уже ПОСЛЕ выхода пакета.
          MCPNAME=$(node -p "require('./package.json').mcpName || ''")
          SRVNAME=$(node -p "require('./server.json').name")
          if [ "$MCPNAME" != "$SRVNAME" ]; then
            echo "::error::package.json mcpName='$MCPNAME', а server.json name='$SRVNAME' — реестр отвергнет заявку"
            exit 1
          fi
          echo "mcpName сходится с именем в реестре: $MCPNAME"
      # Манифест реестра проверяем ДО публикации в npm: публикация необратима,
      # а плохой манифест иначе всплывёт следующим шагом — когда пакет уже вышел.
      - name: server.json валиден по схеме реестра
        run: |
          set -euo pipefail
          PLATFORM=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${PLATFORM}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher validate

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # registry-url здесь НЕ указываем: он пишет _authToken в .npmrc и ломает OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Доверенного издателя умеет только npm 11.5.1 и новее. Node 24 приносит
      # 11.13 — этого достаточно, и специально ставить ничего не нужно.
      #
      # `npm install -g npm@latest` здесь стоял и был снят намеренно: это
      # движущаяся цель. Она уже один раз сломала выкат — в джобе verify тесты
      # шли на npm 10, а на публикации клиент оказывался 12-м, с другой формой
      # вывода `npm pack --json`. Одна версия во всех джобах убирает сам класс.
      #
      # Проверка остаётся: если базовый образ однажды поедет назад, отказ
      # назовёт причину, а не превратится в «нужен логин».
      - name: npm умеет доверенного издателя
        run: |
          set -euo pipefail
          V=$(npm --version)
          echo "npm $V"
          node -e '
            const [a,b,c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} не умеет доверенного издателя, нужен 11.5.1+`);
              process.exit(1);
            }
          ' "$V"

      # Авторизация — доверенный издатель npm (OIDC), связанный с этим
      # репозиторием и именно с этим файлом workflow. Долгоживущего токена в
      # репозитории нет и быть не должно: он не нужен и его нечему утечь.
      #
      # Имя файла workflow — часть связи на стороне npm. Переименуешь его или
      # перенесёшь публикацию в другой файл — публикация начнёт отказывать,
      # пока связь не обновлена на npmjs.com.
      - name: npm publish
        run: npm publish --provenance --access public

  registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Владение npm-пакетом реестр проверяет по полю mcpName в package.json —
      # то есть читает сам пакет с npm. Пока версия не разошлась по CDN, читать
      # нечего, и заявка падает на валидации. Отсюда пауза.
      - name: Дать npm распространить пакет
        run: sleep 120
      - name: Опубликовать в Official MCP Registry
        run: |
          set -euo pipefail
          PLATFORM=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${PLATFORM}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Проверить, что реестр действительно отдаёт сервер
        run: |
          set -euo pipefail
          sleep 15
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=yandex-metrika-mcp-server" \
            | tee /tmp/registry.json
          grep -q 'io.github.artgas1/yandex-metrika-mcp-server' /tmp/registry.json
